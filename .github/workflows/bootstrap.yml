name: Nonsecret gate capability
run-name: Nonsecret gate capability
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: nonsecret-capability-v1
  cancel-in-progress: false
jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Create initial nonsecret exact tag
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.request, urllib.error
          repo = 'finalreality777-creator/c11-bootstrap-gate-20261029'
          def require(ok):
              if not ok:
                  print('STOP_SEED', flush=True)
                  raise SystemExit(1)
          require(os.environ.get('GITHUB_REPOSITORY') == repo and os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and os.environ.get('GITHUB_REF') == 'refs/heads/main' and os.environ.get('GITHUB_RUN_ATTEMPT') == '1')
          sha = os.environ['GITHUB_SHA']
          payload = json.dumps({'ref': 'refs/tags/bootstrap-v1', 'sha': sha}).encode()
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
          request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/refs', data=payload, method='POST', headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status, body = response.status, json.loads(response.read())
          except urllib.error.HTTPError:
              print('STOP_SEED_CREATE', flush=True)
              raise SystemExit(1)
          require(status == 201 and body.get('object', {}).get('sha') == sha)
          request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/ref/tags/bootstrap-v1', headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              require(response.status == 200 and json.loads(response.read()).get('object', {}).get('sha') == sha)
          print('PASS_SEED_EXACT_TAG_READBACK', flush=True)
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: et-c11-api-bootstrap
    permissions:
      contents: write
    steps:
      - name: Nonsecret validation only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          SENTINEL: ${{ secrets.ET_C11_NONSECRET_SENTINEL }}
        run: |
          import json, os, re, sys, urllib.request, urllib.error
          REPO = 'finalreality777-creator/c11-bootstrap-gate-20261029'
          TAG = 'bootstrap-v1'
          NONCE = '73b70415187941b9a816487a56fe063b'
          SHA = os.environ.get('GITHUB_SHA', '')
          def require(ok, code):
              if not ok:
                  print('STOP_' + code, flush=True)
                  raise SystemExit(1)
          require(os.environ.get('GITHUB_REPOSITORY') == REPO, 'REPO')
          require(os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch', 'EVENT')
          require(os.environ.get('GITHUB_REF') == 'refs/tags/' + TAG, 'REF')
          require(os.environ.get('GITHUB_RUN_ATTEMPT') == '1', 'ATTEMPT')
          require(os.environ.get('GITHUB_WORKFLOW_REF') == REPO + '/.github/workflows/bootstrap.yml@refs/tags/' + TAG, 'WORKFLOW_REF')
          require(os.environ.get('GITHUB_WORKFLOW_SHA') == SHA, 'WORKFLOW_SHA')
          require(re.fullmatch('[0-9a-f]{40}', SHA) is not None, 'SHA')
          require(os.environ.get('SENTINEL') == 'c11-nonsecret-sentinel-v1', 'SENTINEL')
          print('PASS_APPROVED_EXACT_TAG_SENTINEL', flush=True)
          def api(method, path, payload=None):
              require(path.startswith('/git/'), 'API_PATH')
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + path, data=data, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.loads(response.read() or b'{}')
              except urllib.error.HTTPError as error:
                  return error.code, json.loads(error.read() or b'{}')
          def read_ref(name, expected):
              status, body = api('GET', '/git/ref/tags/' + name)
              require(status == 200 and body.get('ref') == 'refs/tags/' + name and body.get('object', {}).get('type') == 'commit' and body['object'].get('sha') == expected, 'REF_READBACK')
          def denied(method, path, payload, code):
              status, body = api(method, path, payload)
              require(status == 422 and 'Repository rule violations' in body.get('message', ''), code)
              print('PASS_' + code, flush=True)
          read_ref(TAG, SHA)
          marker = 'used-' + NONCE
          status, body = api('POST', '/git/refs', {'ref': 'refs/tags/' + marker, 'sha': SHA})
          require(status == 201 and body.get('object', {}).get('sha') == SHA, 'ONE_USE_CLAIM')
          read_ref(marker, SHA)
          print('PASS_ATOMIC_CLAIM_READBACK', flush=True)
          status, body = api('POST', '/git/refs', {'ref': 'refs/tags/' + marker, 'sha': SHA})
          require(status == 422 and body.get('message') == 'Reference already exists', 'DUPLICATE_CLAIM')
          read_ref(marker, SHA)
          print('PASS_DUPLICATE_CLAIM_REJECTED_REPLAY_STOP', flush=True)
          status, body = api('GET', '/git/commits/' + SHA)
          require(status == 200 and body.get('sha') == SHA, 'COMMIT_READ')
          tree = body.get('tree', {}).get('sha', '')
          require(re.fullmatch('[0-9a-f]{40}', tree) is not None, 'TREE')
          status, body = api('POST', '/git/commits', {'message': 'Nonsecret immutable-ref negative control', 'tree': tree, 'parents': [SHA],
              'author': {'name': 'github-actions[bot]', 'email': '41898282+github-actions[bot]@users.noreply.github.com'}, 'committer': {'name': 'github-actions[bot]', 'email': '41898282+github-actions[bot]@users.noreply.github.com'}})
          other = body.get('sha', '')
          require(status == 201 and other != SHA and re.fullmatch('[0-9a-f]{40}', other) is not None, 'CONTROL_COMMIT')
          denied('PATCH', '/git/refs/tags/' + TAG, {'sha': other, 'force': True}, 'TAG_MOVE_BLOCKED')
          read_ref(TAG, SHA)
          denied('DELETE', '/git/refs/tags/' + TAG, None, 'TAG_DELETE_BLOCKED')
          read_ref(TAG, SHA)
          denied('PATCH', '/git/refs/tags/' + marker, {'sha': other, 'force': True}, 'MARKER_RESET_BLOCKED')
          read_ref(marker, SHA)
          denied('DELETE', '/git/refs/tags/' + marker, None, 'MARKER_DELETE_BLOCKED')
          read_ref(marker, SHA)
          print('PASS_NONSECRET_IN_JOB_CONTROLS', flush=True)
